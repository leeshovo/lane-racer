name: Tests

# Läuft bei jedem Push und bei jeder Pull-Request: Spiellogik prüfen, bevor etwas veröffentlicht wird.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  e2e:
    # Rauchtest im echten Browser (Chrome ist auf den GitHub-Rechnern vorinstalliert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:e2e
